name: Bug report
description: Something in the game does not work as the design says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps from loading the page. Attach an exported save if you have one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash, or the URL you played at
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 158 on macOS 27
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Map and rendering
        - Game rules
        - AI
        - UI and controls
        - Touch input
        - Saves
        - Other
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional
