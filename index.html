<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>山河</title>
    <style>
      /*
       * The interface is restrained, because the map is not: ink-black
       * translucent panels, vermilion as the only accent, a Song-style serif
       * for titles and a sans-serif for the rest, line icons. Spacing comes
       * from one scale (4, 8, 12, 16, 24). Everything is laid out for a
       * 1280 × 720 window and scaled as a whole.
       */
      :root {
        --ink: rgb(13 14 16 / 84%);
        --ink-deep: rgb(11 12 14 / 95%);
        --ink-solid: #121316;
        --wash: rgb(236 231 220 / 6%);
        --wash-strong: rgb(236 231 220 / 13%);
        --line: rgb(236 231 220 / 18%);
        --line-strong: rgb(236 231 220 / 48%);
        --paper: #ece7dc;
        --dim: #a09a8d;
        --vermilion: #c8402d;
        --serif: 'Songti SC', 'STSongti-SC-Regular', STSong, 'Noto Serif CJK SC', 'Source Han Serif SC',
          'Source Han Serif CN', SimSun, 'Songti TC', Georgia, 'Times New Roman', serif;
        --sans: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC',
          sans-serif;
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 24px;
        --radius: 2px;
        --bar: 40px;
        --side: 312px;
        /* the height of a row of the majors strip, and the room the two buttons under the top bar take */
        --major: 28px;
        --under-slots: 44px;
      }
      /*
       * On a touch device every control is at least 36 pixels of the screen
       * in both directions. The interface is scaled as a whole, so the size
       * is divided by the scale (`--ui-scale`, set with the zoom).
       */
      @media (pointer: coarse) {
        :root {
          --touch: calc(36px / var(--ui-scale, 1));
          --bar: calc(var(--touch) + 8px);
          --major: calc(var(--touch) + 2px);
          --under-slots: calc(var(--touch) + 14px);
        }
        /* stronger than every size a control sets for itself further down */
        #ui button,
        #ui input[type='range'] {
          min-width: var(--touch) !important;
          min-height: var(--touch) !important;
        }
        #ui #policy-slots button.policy-slot {
          padding-right: calc(var(--touch) + 4px);
        }
        #ui #policy-slots button.slot-clear {
          top: 0;
          right: 0;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #10151c;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui {
        color: var(--paper);
        font: 13px/1.5 var(--sans);
        user-select: none;
      }
      #ui.fatal {
        position: fixed;
        top: var(--s3);
        left: var(--s3);
        padding: var(--s2) var(--s3);
        background: var(--ink);
      }
      #ui [hidden] {
        display: none !important;
      }
      .panel {
        background: var(--ink);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        backdrop-filter: blur(8px);
      }
      #ui h1,
      #ui h2,
      #ui h3,
      #ui .title {
        margin: 0;
        font-family: var(--serif);
        font-weight: 600;
      }
      #ui h1 {
        font-size: 30px;
        letter-spacing: 0.2em;
      }
      #ui h2 {
        padding-left: var(--s2);
        border-left: 4px solid var(--nation, var(--line-strong));
        font-size: 19px;
        line-height: 1.3;
      }
      #ui h3 {
        margin: var(--s3) 0 var(--s1);
        color: var(--dim);
        font: 12px/1.3 var(--sans);
        letter-spacing: 0.08em;
      }
      .icon {
        flex: none;
        width: 1.2em;
        height: 1.2em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* controls */
      #ui button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: var(--s1) 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--wash);
        color: inherit;
        font: inherit;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background-color 0.12s;
      }
      #ui button:hover:not(:disabled) {
        border-color: var(--line-strong);
        background: var(--wash-strong);
      }
      #ui button:disabled {
        opacity: 0.42;
        cursor: default;
      }
      #ui button.accent {
        border-color: var(--vermilion);
        background: var(--vermilion);
        color: #fff;
      }
      #ui button.accent:hover:not(:disabled) {
        border-color: #fff;
        background: var(--vermilion);
      }
      #ui button.active {
        border-color: var(--vermilion);
        box-shadow: inset 0 0 0 1px var(--vermilion);
      }
      #ui button.icon-only {
        padding: var(--s1);
      }
      #ui button.close,
      #ui button.note-close {
        border-color: transparent;
        background: none;
        color: var(--dim);
      }
      #ui button.close:hover:not(:disabled),
      #ui button.note-close:hover:not(:disabled) {
        color: var(--paper);
      }
      /* the ring of the control the keyboard is on */
      #ui :focus {
        outline: none;
      }
      #ui :focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }
      #ui input[type='range'] {
        flex: 1;
        min-width: 0;
        height: 18px;
        margin: 0;
        accent-color: var(--vermilion);
        cursor: pointer;
      }
      .scroll {
        overflow-y: auto;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s1) var(--s3);
      }
      .status {
        color: var(--vermilion);
      }
      .stat {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-variant-numeric: tabular-nums;
      }
      .stat .icon,
      .kit-label .icon,
      .slot .icon {
        color: var(--dim);
      }
      .stat-label {
        color: var(--dim);
      }
      .segmented {
        display: flex;
      }
      #ui .segmented button {
        flex: 1;
        margin-left: -1px;
        border-radius: 0;
      }
      #ui .segmented button:first-child {
        margin-left: 0;
      }
      #ui .segmented button.active {
        position: relative;
      }
      .tag {
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--dim);
        font: 11px/1.6 var(--sans);
        white-space: nowrap;
      }
      .difficulty {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--dim);
        font-size: 11px;
        white-space: nowrap;
      }
      .pips {
        display: inline-flex;
        gap: 2px;
      }
      .pip {
        width: 5px;
        height: 5px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        box-sizing: border-box;
      }
      .pip.on {
        border-color: var(--paper);
        background: var(--paper);
      }
      [data-difficulty='veryHard'] .pip.on {
        border-color: var(--vermilion);
        background: var(--vermilion);
      }
      .swatch {
        padding-left: var(--s2);
        border-left: 4px solid var(--nation, var(--line-strong));
        font-family: var(--serif);
        font-size: 15px;
      }
      #ui button.swatch {
        padding: 0 var(--s2);
        border-width: 0 0 0 4px;
        border-color: var(--nation, var(--line-strong));
        border-radius: 0;
        background: none;
        font: 600 16px/1.6 var(--serif);
      }
      #ui button.swatch:hover:not(:disabled),
      #ui button.swatch.active {
        background: var(--wash-strong);
        box-shadow: none;
      }
      #ui button.swatch:disabled {
        opacity: 1;
      }

      /* the cover: nation select */
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(320px, 404px) minmax(0, 1fr) minmax(300px, 356px);
        grid-template-rows: minmax(0, 1fr);
        gap: var(--s4);
        padding: var(--s5);
        box-sizing: border-box;
        /* ink at the edges, the map in the middle */
        background: linear-gradient(
          90deg,
          rgb(8 9 11 / 78%),
          rgb(8 9 11 / 18%) 36%,
          rgb(8 9 11 / 6%) 55%,
          rgb(8 9 11 / 62%)
        );
        pointer-events: none;
      }
      #start > * {
        pointer-events: auto;
      }
      .cover-list,
      .cover-kit {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: var(--s5) var(--s5) var(--s4);
        box-sizing: border-box;
      }
      .cover-list {
        grid-column: 1;
      }
      .cover-kit {
        grid-column: 3;
        align-self: center;
        max-height: 100%;
      }
      .cover-title {
        display: flex;
        align-items: flex-start;
        gap: var(--s3);
        margin-bottom: var(--s3);
        padding-bottom: var(--s3);
        border-bottom: 1px solid var(--line);
      }
      #ui .cover-title h1 {
        flex: 1;
        font-size: 68px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.16em;
        text-shadow: 0 2px 18px rgb(0 0 0 / 60%);
      }
      #ui:lang(en) .cover-title h1 {
        font-size: 48px;
        letter-spacing: 0.04em;
      }
      /* the seal: the other language's name of the game, in vermilion */
      .seal {
        align-self: flex-end;
        padding: 3px 5px;
        border-radius: var(--radius);
        background: var(--vermilion);
        color: #fff;
        font: 600 10px/1.2 var(--serif);
        letter-spacing: 0.22em;
        text-indent: 0.22em;
      }
      :lang(en) .seal {
        padding: 5px 3px;
        font-size: 15px;
        letter-spacing: 0.1em;
        text-indent: 0;
        writing-mode: vertical-rl;
      }
      .filters {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        margin-bottom: var(--s2);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1);
      }
      #ui button.chip {
        padding: 1px var(--s2);
        font-size: 12px;
      }
      #ui #nation-sort button {
        padding: 1px var(--s2);
        font-size: 12px;
      }
      #ui .region h3 {
        margin-top: var(--s3);
      }
      .nations {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s1);
      }
      #ui button.nation {
        justify-content: flex-start;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        padding: 3px var(--s2);
        border-left: 4px solid var(--nation, var(--line-strong));
        text-align: left;
      }
      #ui button.nation.active {
        border-color: var(--vermilion);
        border-left-color: var(--nation, var(--vermilion));
        background: var(--wash-strong);
      }
      .nation-name {
        font-family: var(--serif);
        font-size: 15px;
        white-space: nowrap;
      }
      .nation-other {
        flex: 1;
        overflow: hidden;
        color: var(--dim);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nation .difficulty-name {
        display: none;
      }
      /* a default major nation carries a small seal */
      .nation.default-major .nation-name::after {
        content: '';
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-left: 4px;
        background: var(--vermilion);
        vertical-align: 0.35em;
      }
      .cover-list footer,
      .cover-kit footer,
      .card footer {
        display: flex;
        gap: var(--s2);
        margin-top: var(--s4);
      }
      .cover-list footer {
        padding-top: var(--s3);
        border-top: 1px solid var(--line);
      }
      .cover-kit footer,
      .card footer {
        justify-content: flex-end;
      }
      #ui footer button {
        padding: 6px 14px;
      }
      #ui #play {
        flex: 1;
        padding: 10px 18px;
        font: 600 17px/1.2 var(--serif);
        letter-spacing: 0.3em;
      }
      #ui:lang(en) #play {
        letter-spacing: 0.08em;
      }
      #levels {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        margin-top: var(--s3);
      }
      #ui #levels .segmented button {
        padding: 3px 0;
        font-size: 12px;
      }
      .cover-kit header {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
        margin-bottom: var(--s2);
      }
      #ui .cover-kit h2 {
        font-size: 28px;
      }
      .cover-kit .scroll {
        margin-top: var(--s2);
      }

      /* a kit, row by row */
      .kit {
        display: flex;
        flex-direction: column;
      }
      .kit-row {
        padding: var(--s2) 0;
        border-top: 1px solid var(--line);
      }
      .kit-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .kit-name {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px var(--s2);
        font: 600 16px/1.5 var(--serif);
      }
      .kit-name.with-piece {
        align-items: center;
      }
      .kit-aside {
        color: var(--dim);
        font: 12px/1.5 var(--sans);
      }
      .kit-effect {
        line-height: 1.45;
      }

      /* the end screen */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--s4);
        background: rgb(8 9 11 / 60%);
      }
      .card {
        display: flex;
        flex-direction: column;
        width: min(760px, 100%);
        max-height: 100%;
        padding: var(--s5);
        box-sizing: border-box;
      }
      .card header {
        margin-bottom: var(--s2);
      }
      #ui .card h1 {
        font-size: 44px;
      }
      #ranking {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      #ranking th,
      #ranking td {
        padding: 3px var(--s2);
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      #ranking th:nth-child(2),
      #ranking td:nth-child(2) {
        text-align: left;
      }
      #ranking th {
        color: var(--dim);
        font-weight: 400;
      }
      #ranking tr.winner td {
        color: var(--vermilion);
        font-weight: 600;
      }
      #ranking tr.mine td:nth-child(2) {
        text-decoration: underline;
      }
      #ranking tr.gone td {
        opacity: 0.5;
      }
      #end-result {
        margin: 0 0 var(--s3);
      }

      /* the HUD */
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
        height: var(--bar);
        padding: 0 var(--s3);
        box-sizing: border-box;
        border-width: 0 0 1px;
        border-radius: 0;
        font-variant-numeric: tabular-nums;
      }
      .stats {
        display: flex;
        flex: 1;
        align-items: center;
        gap: var(--s4);
      }
      #turn {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
      }
      #era {
        font: 600 16px/1 var(--serif);
        letter-spacing: 0.1em;
      }
      #turn-counter {
        color: var(--dim);
      }
      .topbar-buttons {
        display: flex;
        flex: 1;
        justify-content: flex-end;
        gap: var(--s1);
      }
      #ui .topbar-buttons button {
        border-color: transparent;
        background: none;
      }
      #ui .topbar-buttons button:hover,
      #ui .topbar-buttons button.active {
        border-color: var(--line);
        background: var(--wash-strong);
        box-shadow: none;
      }
      #ui .topbar-buttons button.active {
        border-bottom-color: var(--vermilion);
      }
      #slots {
        position: fixed;
        top: calc(var(--bar) + var(--s2));
        left: var(--s3);
        display: flex;
        gap: var(--s1);
      }
      #ui button.slot {
        justify-content: flex-start;
        min-width: 92px;
        padding: 5px 10px;
        background: var(--ink);
      }
      #ui button.slot:disabled {
        opacity: 1;
      }
      .slot-value {
        font-variant-numeric: tabular-nums;
      }
      #notifications {
        position: fixed;
        top: calc(var(--bar) + 20px + var(--major) * var(--majors-rows, 1));
        right: var(--s3);
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        width: 256px;
      }
      #ui[data-side='open'] #notifications,
      #ui[data-side='open'] #majors {
        right: calc(var(--side) + var(--s3));
      }
      .note {
        display: flex;
        align-items: center;
        gap: var(--s1);
        padding: 2px var(--s1);
        border-left: 2px solid var(--line-strong);
      }
      .note[data-offer-kind] {
        border-left-color: var(--vermilion);
      }
      #ui .note button {
        padding: 2px 7px;
      }
      #ui button.note-text {
        flex: 1;
        justify-content: flex-start;
        border-color: transparent;
        background: none;
        text-align: left;
      }
      #minimap-box {
        position: fixed;
        left: var(--s3);
        bottom: var(--s3);
        padding: var(--s1);
      }
      #minimap {
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }
      #minimap canvas {
        display: block;
      }
      .minimap-mark {
        position: absolute;
        top: -7px;
        left: -7px;
        width: 12px;
        height: 12px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px var(--vermilion);
        pointer-events: none;
      }
      #lenses {
        margin-top: var(--s1);
      }
      #ui #lenses button {
        padding: 1px 2px;
        font-size: 11px;
      }
      #selection {
        position: fixed;
        left: 50%;
        bottom: var(--s3);
        display: flex;
        align-items: center;
        gap: var(--s3);
        max-width: calc(100% - 540px);
        padding: var(--s2) var(--s3);
        transform: translateX(-50%);
      }
      /* a piece as on the board: the era's material, the nation's band, the character on top */
      .piece {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        border: 3px solid var(--nation, #888);
        border-radius: 50%;
        box-sizing: border-box;
        background: radial-gradient(circle at 35% 30%, #e6dcc4, #c9bc9c);
        color: #2a211a;
        font: 600 21px/1 var(--serif);
      }
      .piece[data-era='0'] {
        background: radial-gradient(circle at 35% 30%, #d9b592, #b98a62);
      }
      .piece[data-era='1'] {
        background: radial-gradient(circle at 35% 30%, #a39258, #6f6238);
        color: #f1ead6;
      }
      .piece[data-era='2'] {
        background: radial-gradient(circle at 35% 30%, #7a2a20, #47130f);
        color: #f1ead6;
      }
      .piece[data-era='3'] {
        background: radial-gradient(circle at 35% 30%, #b9d6bd, #86ab8c);
      }
      .piece[data-era='4'] {
        background: radial-gradient(circle at 35% 30%, #dcc071, #a98a3a);
      }
      .piece[data-era='5'] {
        background: radial-gradient(circle at 35% 30%, #b9c0c8, #7f8891);
      }
      /* a unique unit's character is filled with gold */
      .piece.unique {
        color: #f3cb52;
        text-shadow:
          0 1px 0 rgb(50 32 0 / 90%),
          0 0 2px rgb(50 32 0 / 70%);
      }
      .piece.small {
        width: 24px;
        height: 24px;
        border-width: 2px;
        background: radial-gradient(circle at 35% 30%, #3a332b, #1d1915);
        font-size: 14px;
      }
      .facts .title {
        font-size: 16px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1);
      }
      #action-box {
        position: fixed;
        right: var(--s3);
        bottom: var(--s3);
        display: flex;
        align-items: stretch;
        gap: var(--s2);
      }
      #ui #main-action {
        min-width: 176px;
        padding: var(--s3) 18px;
        border-color: var(--line-strong);
        background: var(--ink-solid);
        font: 600 17px/1.2 var(--serif);
        letter-spacing: 0.06em;
      }
      #ui #main-action:hover:not(:disabled) {
        border-color: var(--paper);
      }
      #ui #main-action.accent {
        border-color: var(--vermilion);
        background: var(--vermilion);
      }
      #ui #main-action.accent:hover {
        border-color: #fff;
      }
      #ui #main-action.busy {
        opacity: 1;
        border-color: var(--line);
        color: var(--dim);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          border-color: var(--vermilion);
        }
      }
      #speed {
        overflow: hidden;
      }
      #ui #speed button {
        min-width: 40px;
        border-width: 0;
      }

      /* side panels: a city, another polity, the player's own kit */
      #city-panel,
      #polity-panel,
      #kit-panel {
        position: fixed;
        top: var(--bar);
        display: flex;
        flex-direction: column;
        width: var(--side);
        padding: var(--s3) var(--s4);
        box-sizing: border-box;
      }
      #city-panel,
      #polity-panel {
        right: 0;
        border-width: 0 0 1px 1px;
        border-radius: 0 0 0 var(--radius);
        animation: slide 0.16s ease-out;
      }
      #city-panel {
        bottom: 76px;
      }
      #polity-panel {
        max-height: calc(100% - 116px);
      }
      #kit-panel {
        top: calc(var(--bar) + var(--under-slots));
        left: var(--s3);
        /* down to the minimap, which is at most 190 high under its lenses */
        max-height: calc(100% - var(--bar) - var(--under-slots) - 252px);
        animation: drop 0.14s ease-out;
        z-index: 2;
      }
      #polity-panel .scroll {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
      }
      #ui #polity-panel h3 {
        margin-top: 0;
      }
      @keyframes slide {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
      }
      @keyframes drop {
        from {
          transform: translateY(-8px);
          opacity: 0;
        }
      }
      #city-panel header,
      #polity-panel header,
      #kit-panel header {
        display: flex;
        align-items: center;
        gap: var(--s2);
        margin-bottom: var(--s2);
      }
      #city-panel h2,
      #polity-panel h2,
      #kit-panel h2 {
        flex: 1;
      }
      .yields {
        display: flex;
        justify-content: space-between;
        margin-top: var(--s2);
        padding: var(--s1) 0;
        border-block: 1px solid var(--line);
      }
      #city-queue {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #city-queue li,
      #ui button.option {
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        gap: var(--s2);
        width: 100%;
        box-sizing: border-box;
        text-align: left;
      }
      #city-queue li {
        align-items: center;
        padding: 1px 0 1px var(--s2);
        border-left: 2px solid var(--line);
      }
      #city-queue li:first-child:not(.empty) {
        border-left-color: var(--vermilion);
      }
      #city-queue li.empty {
        color: var(--dim);
      }
      #ui button.option {
        margin-bottom: 3px;
      }
      .option-name {
        flex: 1;
        min-width: 0;
      }
      .option-cost,
      .option-turns {
        color: var(--dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .option-row {
        display: flex;
        align-items: stretch;
        gap: var(--s1);
        margin-bottom: 3px;
      }
      #ui .option-row button.option {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
      }
      /* a name and its figures that do not fit one line (English) take two: the figures go under the name */
      #ui #city-panel button.option {
        flex-wrap: wrap;
        row-gap: 0;
      }
      #city-panel button.option .option-name {
        flex: 1 1 auto;
      }
      #ui #trade-picker button.option {
        flex-wrap: wrap;
        row-gap: 0;
      }
      #trade-picker .reason {
        order: 1;
        flex-basis: 100%;
      }
      #ui button.buy,
      #ui #trade-open {
        flex: none;
        padding: 2px 7px;
        font-size: 12px;
        white-space: nowrap;
      }
      #ui button.switch {
        justify-content: flex-start;
        gap: var(--s2);
        width: 100%;
        margin-top: var(--s2);
      }
      .switch-mark {
        flex: none;
        position: relative;
        width: 22px;
        height: 12px;
        border: 1px solid currentColor;
        border-radius: 7px;
        opacity: 0.7;
      }
      .switch-mark::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        transition: transform 0.12s;
      }
      .switch.active .switch-mark {
        opacity: 1;
      }
      .switch.active .switch-mark::after {
        transform: translateX(10px);
      }
      #ui #city-airstrike {
        width: 100%;
        margin-top: var(--s2);
      }
      .facts-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .facts-list li {
        display: flex;
        align-items: baseline;
        gap: var(--s2);
        padding: 1px 0 1px var(--s2);
        border-left: 2px solid var(--line);
      }
      .facts-list li.lead {
        border-left-color: var(--vermilion);
      }
      .favour-value,
      #trade-slots {
        color: var(--paper);
        font-variant-numeric: tabular-nums;
      }
      #polity-controls {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      #ui button.control {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        text-align: left;
      }
      #ui button.control:disabled,
      #ui button.option:disabled {
        opacity: 1;
        color: var(--dim);
      }
      .reason {
        color: var(--vermilion);
        font-size: 11px;
      }
      .offer {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0 3px var(--s2);
        border-left: 2px solid var(--vermilion);
      }
      .offer .reason {
        display: block;
      }

      /* the menu and its settings */
      #menu {
        position: fixed;
        top: calc(var(--bar) + var(--s1));
        right: var(--s3);
        display: flex;
        flex-direction: column;
        gap: var(--s1);
        width: 236px;
        /* on a small window at a large interface size the menu is taller than the window: it scrolls */
        max-height: calc(100% - var(--bar) - var(--s3));
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
        padding: var(--s3);
        box-sizing: border-box;
        z-index: 3;
      }
      #menu > * {
        flex-shrink: 0;
      }
      #ui #menu h3 {
        margin: var(--s2) 0 0;
      }
      .menu-actions {
        display: flex;
        flex-direction: column;
        gap: var(--s1);
      }
      #ui .menu-actions button {
        justify-content: flex-start;
      }
      .menu-foot {
        display: flex;
        gap: var(--s1);
        margin-top: var(--s3);
      }
      #ui .menu-foot button {
        flex: 1;
      }
      #ui #menu .segmented button {
        padding: 2px 0;
        font-size: 12px;
      }
      .volume {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }
      .footnote {
        margin-top: var(--s1);
        color: var(--dim);
        font-size: 11px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        padding: 6px 14px;
        border-color: var(--vermilion);
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 5;
      }
      #tooltip {
        position: fixed;
        padding: 3px var(--s2);
        pointer-events: none;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        z-index: 4;
      }
      /* the details of a hex: beside the pointer at rest, above the finger of a long press */
      #hex-card {
        position: fixed;
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-width: 280px;
        padding: 6px var(--s3);
        pointer-events: none;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        z-index: 4;
      }
      .card-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 var(--s2);
      }
      .card-line .title {
        font-size: 15px;
      }
      .card-aside,
      .card-fog {
        color: var(--dim);
      }
      /* whose it is: the nation's colour in front of its name */
      .card-unit .card-aside,
      .card-city .card-aside,
      .card-owner .card-aside {
        padding-left: 6px;
        border-left: 3px solid var(--nation, var(--line-strong));
        line-height: 1.2;
      }
      .card-unitFacts + .card-city,
      .card-unitFacts + .card-unit,
      .card-unitFacts + .card-ground,
      .card-cityFacts + .card-ground {
        margin-top: var(--s1);
        padding-top: var(--s1);
        border-top: 1px solid var(--line);
      }
      .piece.mini {
        width: 24px;
        height: 24px;
        border-width: 2px;
        font-size: 14px;
      }

      /* the major nations, top right: the band is the nation's colour, the foot its standing with the player */
      #majors {
        position: fixed;
        top: calc(var(--bar) + var(--s2));
        right: var(--s3);
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: auto;
        gap: 2px;
        padding: 3px;
      }
      /* twelve English names: two rows of six */
      #majors[data-rows='2'] {
        grid-auto-flow: row;
        grid-template-columns: repeat(6, auto);
      }
      #ui button.major {
        min-width: 30px;
        white-space: nowrap;
        padding: 1px var(--s1) 2px;
        border-width: 3px 1px 2px;
        border-style: solid;
        border-color: var(--nation, var(--line)) var(--line) transparent;
        font: 13px/1.4 var(--serif);
      }
      #ui button.major.gone {
        opacity: 0.35;
        text-decoration: line-through;
      }
      #ui button.major[data-standing='self'] {
        background: var(--wash-strong);
        border-bottom-color: var(--paper);
      }
      #ui button.major[data-standing='war'] {
        border-bottom-color: var(--vermilion);
      }
      #ui button.major[data-standing='truce'] {
        border-bottom: 2px dotted var(--vermilion);
      }
      #ui button.major[data-standing='alliance'],
      #ui button.major[data-standing='overlord'],
      #ui button.major[data-standing='vassal'] {
        border-bottom-color: var(--paper);
      }
      #ui button.major[data-standing='friendly'] {
        border-bottom: 2px dotted var(--paper);
      }
      tr[data-standing='war'] .standing,
      tr[data-standing='truce'] .standing {
        color: var(--vermilion);
      }
      tr[data-standing='peace'] .standing {
        color: var(--dim);
      }

      /* full-screen overlays: tech tree, policies, polities, victory */
      #overlay {
        padding: 0;
        z-index: 6;
      }
      .sheet {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: var(--s3) var(--s5) var(--s4);
        box-sizing: border-box;
        border-width: 0;
        border-radius: 0;
        background: var(--ink-deep);
      }
      .sheet header {
        display: flex;
        align-items: center;
        gap: var(--s5);
        padding-bottom: var(--s2);
        border-bottom: 1px solid var(--line);
      }
      #ui .sheet h1 {
        font-size: 24px;
        letter-spacing: 0.12em;
      }
      .sheet-body {
        flex: 1;
        margin-top: var(--s3);
        overflow: auto;
      }
      .tree {
        position: relative;
        margin: 0 auto;
      }
      .tree-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .tree-lines path {
        fill: none;
        stroke: rgb(236 231 220 / 24%);
        stroke-width: 1.5;
      }
      .tree-lines path.known {
        stroke: rgb(236 231 220 / 70%);
      }
      .tree-era {
        color: var(--dim);
        font: 13px/1.3 var(--serif);
        letter-spacing: 0.12em;
        text-align: center;
      }
      .tree .tree-era {
        position: absolute;
        top: 0;
      }
      #ui button.tech {
        position: absolute;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0;
        padding: var(--s1) var(--s2);
        box-sizing: border-box;
        overflow: hidden;
        background: var(--ink-solid);
        text-align: left;
      }
      .tech-name,
      .card-name {
        font: 600 14px/1.35 var(--serif);
      }
      .tech-meta,
      .tech-unlocks,
      .card-effect,
      .card-cost {
        max-width: 100%;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.35;
      }
      .tech-meta {
        white-space: nowrap;
      }
      .tech-unlocks {
        line-height: 1.3;
      }
      #ui:lang(en) button.tech {
        padding: 2px var(--s2);
      }
      /* what only the player's nation gets */
      .tech-unlocks .unique {
        color: var(--paper);
        text-decoration: underline;
        text-decoration-color: var(--vermilion);
        text-underline-offset: 2px;
      }
      #ui button.tech[data-status='known'] {
        opacity: 1;
        border-color: rgb(236 231 220 / 70%);
        background: rgb(236 231 220 / 16%);
      }
      #ui button.tech[data-status='open'] {
        border-color: var(--paper);
      }
      #ui button.tech[data-status='current'] {
        border-color: var(--vermilion);
        box-shadow: inset 0 0 0 1px var(--vermilion);
      }
      #policy-slots {
        display: flex;
        gap: var(--s2);
        margin-bottom: var(--s4);
      }
      .slot-wrap {
        position: relative;
        display: flex;
        flex: 1;
        min-width: 0;
      }
      #ui button.slot-clear {
        position: absolute;
        top: 3px;
        right: 3px;
        padding: 2px;
        border-color: transparent;
        background: none;
        color: var(--dim);
      }
      #ui button.slot-clear:hover:not(:disabled) {
        border-color: var(--line-strong);
        color: var(--paper);
      }
      #ui button.policy-slot,
      #ui button.policy-card {
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 0;
        min-height: 58px;
        padding: 5px 9px;
        text-align: left;
      }
      #ui button.policy-slot {
        flex: 1;
        min-width: 0;
        padding-right: 28px;
        opacity: 1;
        border-color: var(--vermilion);
      }
      #ui button.policy-slot.empty {
        border-style: dashed;
        border-color: var(--line);
        color: var(--dim);
      }
      #ui button.policy-slot:not(:disabled) {
        box-shadow: inset 0 0 0 1px var(--paper);
      }
      #policy-cards {
        display: grid;
        grid-template-columns: max-content repeat(6, minmax(0, 1fr));
        gap: 6px;
      }
      .card-kind {
        align-self: center;
        padding-right: var(--s1);
        color: var(--dim);
        font-size: 12px;
        white-space: nowrap;
      }
      #ui button.policy-card[data-status='slotted'] {
        opacity: 1;
        border-color: var(--vermilion);
      }
      #ui button.policy-card[data-status='unlocked'],
      #ui button.policy-card[data-status='open'] {
        border-color: var(--paper);
      }
      .card-cost {
        color: var(--paper);
      }
      table.list {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.list th,
      table.list td {
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      table.list th:first-child,
      table.list td:first-child,
      table.list th:nth-child(2),
      table.list td:nth-child(2) {
        text-align: left;
      }
      table.list th {
        color: var(--dim);
        font-weight: 400;
      }
      #ui table.list th button {
        padding: 2px 6px;
      }
      #polities tbody tr {
        cursor: pointer;
      }
      #polities tbody tr:hover,
      table.list tr.mine {
        background: rgb(236 231 220 / 7%);
      }
      #ui button.row-open:hover:not(:disabled) {
        background: none;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
