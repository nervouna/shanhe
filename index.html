<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>山河</title>
    <style>
      :root {
        --ink: rgb(18 20 23 / 86%);
        --ink-solid: #15171a;
        --line: rgb(232 228 218 / 22%);
        --paper: #e8e4da;
        --dim: #a39e92;
        --vermilion: #c8402d;
        --serif: 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'Source Han Serif SC', SimSun, Georgia, serif;
        --sans: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #10151c;
      }
      #map {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui {
        color: var(--paper);
        font: 13px/1.45 var(--sans);
        user-select: none;
      }
      #ui.fatal {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        background: var(--ink);
      }
      #ui [hidden] {
        display: none !important;
      }
      .panel {
        background: var(--ink);
        border: 1px solid var(--line);
        border-radius: 4px;
        backdrop-filter: blur(6px);
      }
      #ui h1,
      #ui h2,
      #ui h3,
      #ui .title {
        margin: 0;
        font-family: var(--serif);
        font-weight: 600;
      }
      #ui h1 {
        font-size: 30px;
        letter-spacing: 0.2em;
      }
      #ui h2 {
        font-size: 19px;
        padding-left: 8px;
        border-left: 4px solid var(--line);
      }
      #ui h3 {
        margin: 12px 0 5px;
        color: var(--dim);
        font: 12px/1.3 var(--sans);
        letter-spacing: 0.08em;
      }
      #ui button {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: rgb(232 228 218 / 6%);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #ui button:hover:not(:disabled) {
        border-color: var(--paper);
      }
      #ui button:disabled {
        opacity: 0.42;
        cursor: default;
      }
      #ui button.accent {
        border-color: var(--vermilion);
        background: var(--vermilion);
        color: #fff;
      }
      #ui button.active {
        border-color: var(--vermilion);
        box-shadow: inset 0 0 0 1px var(--vermilion);
      }
      #ui button.close {
        padding: 0 7px;
        border-color: transparent;
        background: none;
        font-size: 16px;
      }
      .scroll {
        overflow-y: auto;
        min-height: 0;
        scrollbar-width: thin;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .status {
        color: var(--vermilion);
      }
      .stat-label {
        margin-right: 5px;
        color: var(--dim);
      }
      .segmented {
        display: flex;
      }
      #ui .segmented button {
        flex: 1;
        border-radius: 0;
        margin-left: -1px;
      }

      /* overlays: start and end */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgb(10 12 14 / 55%);
      }
      .card {
        display: flex;
        flex-direction: column;
        width: min(820px, 100%);
        max-height: 100%;
        padding: 18px 22px;
        box-sizing: border-box;
      }
      .card header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .card footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      #ui .card footer button {
        padding: 6px 18px;
      }
      .nations {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 5px;
      }
      #ui button.nation {
        display: flex;
        align-items: baseline;
        gap: 8px;
        border-left-width: 4px;
        text-align: left;
      }
      .nation-name {
        font-family: var(--serif);
        font-size: 15px;
      }
      .nation-other {
        color: var(--dim);
        font-size: 12px;
      }
      .nation.major .nation-name::after {
        content: '·';
        margin-left: 3px;
        color: var(--vermilion);
        font-weight: 700;
      }
      #ranking {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      #ranking th,
      #ranking td {
        padding: 3px 8px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      #ranking th:nth-child(2),
      #ranking td:nth-child(2) {
        text-align: left;
      }
      #ranking th {
        color: var(--dim);
        font-weight: 400;
      }
      #ranking tr.winner td {
        color: var(--vermilion);
        font-weight: 600;
      }
      #ranking tr.mine td:nth-child(2) {
        text-decoration: underline;
      }
      #ranking tr.gone td {
        opacity: 0.5;
      }
      #end-result {
        margin: 0 0 12px;
      }

      /* the HUD */
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 38px;
        padding: 0 12px;
        border-width: 0 0 1px;
        border-radius: 0;
        font-variant-numeric: tabular-nums;
      }
      .stats {
        display: flex;
        flex: 1;
        gap: 16px;
        align-items: center;
      }
      .swatch {
        padding-left: 8px;
        border-left: 4px solid;
        font-family: var(--serif);
        font-size: 15px;
      }
      #turn {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      #era {
        font-family: var(--serif);
        font-size: 15px;
      }
      #slots {
        position: fixed;
        top: 48px;
        left: 12px;
        display: flex;
        gap: 6px;
      }
      #ui button.slot {
        min-width: 86px;
        padding: 5px 10px;
        border-color: var(--line);
        background: var(--ink);
        text-align: left;
      }
      #ui button.slot:disabled {
        opacity: 1;
      }
      .topbar-buttons {
        display: flex;
        flex: 1;
        justify-content: flex-end;
        gap: 6px;
      }
      #notifications {
        position: fixed;
        top: 84px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 250px;
      }
      #ui[data-side='open'] #notifications {
        right: 312px;
      }
      .note {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
      }
      #ui .note button {
        padding: 2px 7px;
      }
      #ui button.note-text {
        flex: 1;
        border-color: transparent;
        background: none;
        text-align: left;
      }
      #ui button.note-close {
        border-color: transparent;
        background: none;
        color: var(--dim);
      }
      #minimap-box {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 4px;
      }
      #minimap {
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }
      #minimap canvas {
        display: block;
      }
      .minimap-mark {
        position: absolute;
        top: -7px;
        left: -7px;
        width: 12px;
        height: 12px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px var(--vermilion);
        pointer-events: none;
      }
      #selection {
        position: fixed;
        left: 50%;
        bottom: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        transform: translateX(-50%);
        max-width: calc(100% - 520px);
      }
      .piece {
        display: grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        border: 3px solid;
        border-radius: 50%;
        background: #d9cfb8;
        color: #2a211a;
        font: 600 22px/1 var(--serif);
      }
      .facts .title {
        font-size: 16px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      #action-box {
        position: fixed;
        right: 12px;
        bottom: 12px;
        display: flex;
        align-items: stretch;
        gap: 8px;
      }
      #ui #main-action {
        min-width: 168px;
        padding: 12px 18px;
        border-color: var(--paper);
        background: var(--ink-solid);
        font: 600 17px/1.2 var(--serif);
      }
      #ui #main-action.accent {
        border-color: var(--vermilion);
        background: var(--vermilion);
      }
      #ui #main-action.busy {
        opacity: 1;
        border-color: var(--line);
        color: var(--dim);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          border-color: var(--vermilion);
        }
      }
      #speed {
        overflow: hidden;
      }
      #ui #speed button {
        border-width: 0;
        min-width: 40px;
      }
      #city-panel,
      #polity-panel {
        position: fixed;
        right: 0;
        top: 38px;
        bottom: 76px;
        display: flex;
        flex-direction: column;
        width: 300px;
        padding: 12px 14px;
        box-sizing: border-box;
        border-width: 0 0 1px 1px;
        border-radius: 0 0 0 4px;
        animation: slide 0.16s ease-out;
      }
      #city-panel,
      #polity-panel {
        border-radius: 4px 0 0 4px;
        border-width: 0 0 1px 1px;
      }
      #polity-panel {
        bottom: auto;
        max-height: calc(100% - 114px);
      }
      #polity-panel .scroll {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      @keyframes slide {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
      }
      #city-panel header,
      #polity-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .yields {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      #city-queue {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #city-queue li,
      #ui button.option {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
      }
      #city-queue li {
        padding: 2px 0 2px 8px;
        border-left: 2px solid var(--line);
      }
      #city-queue li:first-child:not(.empty) {
        border-left-color: var(--vermilion);
      }
      #city-queue li.empty {
        color: var(--dim);
      }
      #ui button.option {
        margin-bottom: 3px;
      }
      .option-name {
        flex: 1;
      }
      .option-cost,
      .option-turns {
        color: var(--dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      #menu {
        position: fixed;
        top: 44px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 190px;
        padding: 8px;
        z-index: 3;
      }
      #ui #menu h3 {
        margin: 4px 0 0;
      }
      .footnote {
        margin-top: 4px;
        color: var(--dim);
        font-size: 11px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        padding: 6px 14px;
        border-color: var(--vermilion);
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 5;
      }
      #tooltip {
        position: fixed;
        padding: 3px 8px;
        pointer-events: none;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        z-index: 4;
      }

      /* the major nations, top right */
      #majors {
        position: fixed;
        top: 46px;
        right: 12px;
        display: flex;
        gap: 2px;
        padding: 3px;
      }
      #ui[data-side='open'] #majors {
        right: 312px;
      }
      #ui button.major {
        min-width: 30px;
        padding: 1px 4px 2px;
        border-width: 3px 1px 2px;
        border-style: solid;
        border-color: var(--line);
        border-radius: 2px;
        font: 13px/1.4 var(--serif);
      }
      #ui button.major.gone {
        opacity: 0.35;
        text-decoration: line-through;
      }
      [data-standing='self'] {
        --standing: #e8e4da;
      }
      [data-standing='war'] {
        --standing: #c8402d;
      }
      [data-standing='overlord'],
      [data-standing='vassal'] {
        --standing: #c9a23a;
      }
      [data-standing='alliance'] {
        --standing: #4f9d7a;
      }
      [data-standing='friendly'] {
        --standing: #5b8fb8;
      }
      [data-standing='truce'] {
        --standing: #8f6f66;
      }
      #ui button.major[data-standing] {
        border-bottom-color: var(--standing, var(--line));
      }
      .standing {
        color: var(--standing, inherit);
      }

      /* full-screen overlays: tech tree, policies, polities, victory */
      #overlay {
        padding: 0;
        z-index: 6;
      }
      .sheet {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 12px 20px 16px;
        box-sizing: border-box;
        border-width: 0;
        border-radius: 0;
        background: rgb(18 20 23 / 95%);
      }
      .sheet header {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      #ui .sheet h1 {
        font-size: 22px;
        letter-spacing: 0.1em;
      }
      .sheet-body {
        flex: 1;
        margin-top: 10px;
        overflow: auto;
      }
      .tree {
        position: relative;
        margin: 0 auto;
      }
      .tree-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .tree-lines path {
        fill: none;
        stroke: rgb(232 228 218 / 26%);
        stroke-width: 1.5;
      }
      .tree-lines path.known {
        stroke: rgb(232 228 218 / 70%);
      }
      .tree-era {
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-align: center;
      }
      .tree .tree-era {
        position: absolute;
        top: 0;
      }
      #ui button.tech {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 4px 8px;
        box-sizing: border-box;
        overflow: hidden;
        background: var(--ink-solid);
        text-align: left;
      }
      .tech-name,
      .card-name {
        font: 600 14px/1.35 var(--serif);
      }
      .tech-meta,
      .tech-unlocks,
      .card-effect,
      .card-cost {
        max-width: 100%;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.35;
      }
      .tech-meta,
      .tech-unlocks {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ui button.tech[data-status='known'] {
        opacity: 1;
        border-color: rgb(232 228 218 / 70%);
        background: rgb(232 228 218 / 16%);
      }
      #ui button.tech[data-status='open'] {
        border-color: var(--paper);
      }
      #ui button.tech[data-status='current'] {
        border-color: var(--vermilion);
        box-shadow: inset 0 0 0 1px var(--vermilion);
      }
      #policy-slots {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      #ui button.policy-slot,
      #ui button.policy-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-height: 58px;
        padding: 5px 9px;
        text-align: left;
      }
      #ui button.policy-slot {
        flex: 1;
        opacity: 1;
        border-color: var(--vermilion);
      }
      #ui button.policy-slot.empty {
        border-style: dashed;
        border-color: var(--line);
        color: var(--dim);
      }
      #ui button.policy-slot:not(:disabled) {
        box-shadow: inset 0 0 0 1px var(--paper);
      }
      #policy-cards {
        display: grid;
        grid-template-columns: 44px repeat(6, minmax(0, 1fr));
        gap: 6px;
      }
      .card-kind {
        align-self: center;
        color: var(--dim);
        font-size: 12px;
      }
      #ui button.policy-card[data-status='slotted'] {
        opacity: 1;
        border-color: var(--vermilion);
      }
      #ui button.policy-card[data-status='unlocked'],
      #ui button.policy-card[data-status='open'] {
        border-color: var(--paper);
      }
      .card-cost {
        color: var(--paper);
      }
      table.list {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.list th,
      table.list td {
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      table.list th:first-child,
      table.list td:first-child,
      table.list th:nth-child(2),
      table.list td:nth-child(2) {
        text-align: left;
      }
      table.list th {
        color: var(--dim);
        font-weight: 400;
      }
      #ui table.list th button {
        padding: 2px 6px;
      }
      #polities tbody tr {
        cursor: pointer;
      }
      #polities tbody tr:hover,
      table.list tr.mine {
        background: rgb(232 228 218 / 7%);
      }

      /* lists and controls in the side panels */
      .facts-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .facts-list li {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 1px 0 1px 8px;
        border-left: 2px solid var(--line);
      }
      .facts-list li.lead {
        border-left-color: var(--vermilion);
      }
      .favour-value,
      #trade-slots {
        color: var(--paper);
        font-variant-numeric: tabular-nums;
      }
      #polity-controls {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #ui button.control {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
      }
      #ui button.control:disabled,
      #ui button.option:disabled {
        opacity: 1;
        color: var(--dim);
      }
      .reason {
        color: var(--vermilion);
        font-size: 11px;
      }
      .offer {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0 3px 8px;
        border-left: 2px solid var(--vermilion);
      }
      .option-row {
        display: flex;
        align-items: stretch;
        gap: 4px;
        margin-bottom: 3px;
      }
      #ui .option-row button.option {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
      }
      #ui button.buy,
      #ui #trade-open {
        flex: none;
        padding: 2px 7px;
        font-size: 12px;
        white-space: nowrap;
      }
      #ui #city-airstrike {
        margin-top: 8px;
        width: 100%;
      }
      #lenses {
        margin-top: 4px;
      }
      #ui #lenses button {
        padding: 1px 2px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
